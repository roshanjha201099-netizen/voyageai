version: '3.8'

# ==============================================================================
# Cruiser / VoyageAI - Backend Services
# Run from within the backend directory: docker compose up -d --build
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Redis Cache & Message Broker (Pub/Sub & Task Queue)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cruiser-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  # ----------------------------------------------------------------------------
  # FastAPI Backend API Server
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cruiser-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=8000
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend-network

  # ----------------------------------------------------------------------------
  # Background Task Worker (Async Itinerary Processing)
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cruiser-worker
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - backend-network

volumes:
  redis_data:
    driver: local

networks:
  backend-network:
    driver: bridge

