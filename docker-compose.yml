version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cruiser_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cruiser_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cruiser_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cruiser_backend
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "5247:8000"
    depends_on:
      - db
    networks:
      - cruiser_net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: cruiser_frontend
    restart: always
    ports:
      - "5248:80"
    depends_on:
      - backend
    networks:
      - cruiser_net

volumes:
  postgres_data:

networks:
  cruiser_net:
    driver: bridge
