version: '3.8'

# ==============================================================================
# Cruiser - 3-Tier Full Stack Deployment:
# 1. frontend (React + Vite + Nginx)
# 2. backend  (FastAPI Python REST & WebSocket API)
# 3. db       (PostgreSQL Database)
#
# Run: docker compose up -d --build
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Frontend Service (React + Vite served by Nginx with API/WS reverse proxy)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cruiser-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - cruiser-network

  # ----------------------------------------------------------------------------
  # 2. Backend Service (FastAPI Server)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cruiser-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/cruiser
      - PORT=8000
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cruiser-network

  # ----------------------------------------------------------------------------
  # 3. Database Service (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: cruiser-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cruiser
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cruiser"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cruiser-network

volumes:
  postgres_data:
    driver: local

networks:
  cruiser-network:
    driver: bridge
